apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rimgo-ingress
  namespace: default
  annotations:
    spec.ingressClassName: traefik
    cert-manager.io/issuer: nohost-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: default-anubis-csp@kubernetescrd
    external-dns.alpha.kubernetes.io/ingress-hostname-source: defined-hosts-only
    external-dns.alpha.kubernetes.io/target: nohost.network
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  rules:
    - host: rimgo.nohost.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rimgo-svc
                port:
                  name: anubis
  tls:
    - hosts:
        - rimgo.nohost.network
      secretName: rimgo-cert
