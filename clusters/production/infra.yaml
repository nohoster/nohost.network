apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-initcontrollers
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/initControllers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-sync

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/controllers
  dependsOn:
    - name: infra-initcontrollers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-sync

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-config
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/config
  dependsOn:
    - name: infra-controllers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-sync
